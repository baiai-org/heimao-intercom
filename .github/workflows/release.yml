name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          if [ -z "${IDF_PATH:-}" ]; then export IDF_PATH=/opt/esp/idf; fi
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py build
      - name: Build complete image
        shell: bash
        run: |
          version="$(tr -d '\r\n' < firmware/VERSION)"
          python flasher/make_firmware.py --output dist --name "heimao-full-${version}.bin"
          cp firmware/build/openradiolink.bin "dist/heimao-app-OTA-${version}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bins
          path: dist/*.bin

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build APK
        run: |
          cd app
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p dist
          version="$(grep -oP 'versionName = "\K[^"]+' app/app/build.gradle.kts)"
          cp app/app/build/outputs/apk/debug/app-debug.apk "dist/heimao-android-${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  flasher:
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bins
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build/test dependencies
        run: python -m pip install -r flasher/requirements-build.txt
      - name: Regression tests against the real image
        shell: pwsh
        run: |
          $version = (Get-Content firmware/VERSION).Trim()
          $env:ORL_FLASHER_FIXTURE = "dist\heimao-full-$version.bin"
          python flasher/test_flasher.py
      - name: Build public EXE (no embedded firmware)
        run: powershell -ExecutionPolicy Bypass -File flasher/build.ps1 -Python python -OutputDirectory dist/flasher -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: flasher-exe
          path: dist/flasher/*.exe

  publish:
    needs: [firmware, android, flasher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/*.apk
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
