name: Feature request
description: 提一个功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不是只给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 固件
        - Android APP
        - 刷机工具
        - 文档
        - 其他
  - type: checkboxes
    id: commercial
    attributes:
      label: 用途
      options:
        - label: 我会用于商业场景，并已知晓需要取得授权
